<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Touchpad Controller</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .header {
            text-align: center;
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }
        #touchpad {
            flex: 1;
            background: #1e1e1e;
            border: 2px dashed #333;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-weight: 500;
        }
        #touchpad:active {
            border-color: #0088cc;
        }
        .controls {
            display: flex;
            gap: 12px;
            height: 80px;
            margin-top: 12px;
        }
        .btn {
            flex: 1;
            background: #2b2b2b;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.1s;
        }
        .btn:active {
            background: #0088cc;
        }
    </style>
</head>
<body>

    <div class="header">Barmog'ingiz bilan kursorni boshqaring</div>
    <div id="touchpad">Touchpad sohasi</div>

    <div class="controls">
        <button class="btn" id="leftBtn">CHAP</button>
        <button class="btn" id="rightBtn">O'NG</button>
    </div>

    <script>
        // LocalTunnel URL manzili dinamik tarzda ulanadi
        let SERVER_URL = localStorage.getItem("SERVER_URL") || "";

        if (!SERVER_URL) {
            SERVER_URL = prompt("LocalTunnel bergan HTTPS havolani kiriting (masalan: https://xxx.loca.lt):");
            if (SERVER_URL) {
                if (SERVER_URL.endsWith("/")) {
                    SERVER_URL = SERVER_URL.slice(0, -1);
                }
                localStorage.setItem("SERVER_URL", SERVER_URL);
            }
        }

        function send(data) {
            if (!SERVER_URL) return;
            fetch(SERVER_URL + "/cmd", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Bypass-Tunnel-Reminder": "true"
                },
                body: JSON.stringify(data)
            }).catch(() => {});
        }

        const pad = document.getElementById("touchpad");
        let lastX = 0;
        let lastY = 0;

        pad.addEventListener("touchstart", (e) => {
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });

        pad.addEventListener("touchmove", (e) => {
            let dx = (e.touches[0].clientX - lastX) * 2;
            let dy = (e.touches[0].clientY - lastY) * 2;
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
            send({ action: "move", x: dx, y: dy });
        });

        document.getElementById("leftBtn").addEventListener("click", () => {
            send({ action: "left_click" });
        });

        document.getElementById("rightBtn").addEventListener("click", () => {
            send({ action: "right_click" });
        });
    </script>
</body>
</html>
